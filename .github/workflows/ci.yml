name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    container: rust:1.92-trixie
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Install native dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git g++ pkg-config libgtk-4-dev libssl-dev ca-certificates fonts-dejavu-core libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav ffmpeg
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install formatter
        run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Check CLI
        run: |
          ./target/release/sharpshot --version
          ./target/release/sharpshot --help
