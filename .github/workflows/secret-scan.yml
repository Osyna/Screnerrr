name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 10
    steps:
      - name: Install scanner
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git gitleaks ca-certificates libstdc++6
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan working tree and history
        run: |
          gitleaks detect --source . --no-git --redact --no-banner
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gitleaks detect --source . --redact --no-banner
